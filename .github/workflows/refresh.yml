name: 공식 통계 갱신

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (UTC 기준 00:17, 06:17, 12:17, 18:17)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 넥슨·블리자드 통계 수집과 계산
        run: python refresh.py

      - name: 바뀐 내용 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data history
          if ! git diff --cached --quiet; then
            git commit -m "공식 통계 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
            exit 0
          fi
          echo "통계 변동 없음"
          # GitHub는 60일 동안 저장소 활동이 없으면 예약 실행을 멈추므로, 45일간 커밋이 없으면 빈 커밋을 남긴다
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "예약 실행 유지용 커밋"
            git push
          fi
