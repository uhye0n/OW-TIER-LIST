name: 넥슨 통계 갱신

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (UTC 기준 00:17, 06:17, 12:17, 18:17)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 넥슨 통계 수집과 계산
        run: python refresh.py --page index.html --out index.html

      - name: 바뀐 내용 커밋
        run: |
          if git diff --quiet; then
            echo "넥슨 수치 변동 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "넥슨 통계 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
